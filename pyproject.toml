[project]
name = "sdao"
version = "0.1.0"
description = "Project for developing a new optimization approach for Stochastic functions"
authors = [{ name = "ricardoleal20", email = "rick.leal420@gmail.com" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.10,<3.13"

dependencies = [
    "numpy>=2.2.1",
    "tqdm>=4.70.0",
    "matplotlib>=3.10.0",
    "pydash>=8.0.4",
    "pandas>=2.2.3",
    "scipy>=1.15.1",
    "statsmodels>=0.14.4",
    "jinja2>=3.1.6",
    "seaborn>=0.13.2",
    "optuna>=4.4.0",
    # Lower bounds that pull in patched, non-vulnerable releases of
    # transitive dependencies (Pillow, Mako, fonttools) flagged by Dependabot.
    "pillow>=12.3.0",
    "mako>=1.3.12",
    "fonttools>=4.60.2",
]

[dependency-groups]
dev = [
    "ruff>=0.9.7",
    "pyright>=1.1.394",
]

[tool.uv]
package = false

[tool.pyright]
typeCheckingMode = "basic"
reportMissingTypeStubs = false
reportMissingImports = false

[tool.ruff]
line-length = 88

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["model", "analyze_tools"]
